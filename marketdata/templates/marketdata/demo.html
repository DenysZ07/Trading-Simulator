<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trading Simulator</title>

    <style>

        :root {
            --bg: #0b0c0e;
            --panel: #121417;
            --line: #23262b;
            --line-soft: #1a1d21;
            --text: #d8dde3;
            --muted: #6b7280;
            --accent: #d4a24c;
            --up: #2ec4a6;
            --down: #f2645c;
            --up-bg: #10332e;
            --down-bg: #3a1a19;
            --space: 8px;
            --radius: 2px;
            --mono: ui-monospace, "SF Mono", Menlo, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: calc(var(--space) * 3);
            background: var(--bg);
            color: var(--text);
            font-family: "Trebuchet MS", system-ui, sans-serif;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 calc(var(--space) * 3);
        }

        h2 {
            text-align: center;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: calc(var(--space) * 3);
            min-width: 0;
        }

        @media (min-width: 900px) {
            .layout {
                grid-template-columns: 2fr 1fr;
            }
        }

                .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: calc(var(--space) * 1.75);
        }

        .balance .label,
        .panel h2 {
            font-size: 0.625rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: left;
            font-weight: 500;
            margin: 0 0 calc(var(--space) * 0.75);
        }

        .panel h2 {
            border-top: 1px solid var(--line);
            padding-top: calc(var(--space) * 1.25);
            margin-top: calc(var(--space) * 1.5);
        }

        .balance .value {
            font-family: var(--mono);
            font-size: 1.625rem;
            letter-spacing: -0.02em;
        }

        #order-form input,
        #order-form select,
        #symbols button {
            background: var(--panel);
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: calc(var(--space) * 0.75) calc(var(--space) * 1.5);
            font-family: var(--mono);
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            cursor: pointer;
        }

        #symbols button:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        #symbols button.active {
            background: transparent;
            border-color: var(--accent);
            color: var(--accent);
        }

        #order-form {
            gap: calc(var(--space) * 0.75);
        }

        .actions {
            gap: calc(var(--space) * 0.75);
        }

        .actions button {
            border-radius: var(--radius);
            font-size: 0.75rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: calc(var(--space) * 1.125);
        }

        #buy {
            background: var(--up-bg);
            border: 1px solid #1f6f63;
            color: var(--up);
        }

        #sell {
            background: var(--down-bg);
            border: 1px solid #7a3634;
            color: var(--down);
        }

        .position {
            border-bottom: 1px solid var(--line-soft);
            padding: calc(var(--space) * 0.875) 0;
        }

        .position .row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .position .row.muted {
            font-family: var(--mono);
            font-size: 0.6875rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .position .qty,
        .position span {
            font-family: var(--mono);
        }

        .position .symbol {
            font-family: "Trebuchet MS", system-ui, sans-serif;
            font-weight: 600;
            font-size: 0.8125rem;
        }

        .up { color: var(--up); }
        .down { color: var(--down); }

        #message {
            font-family: var(--mono);
            font-size: 0.6875rem;
            min-height: 1rem;
            margin-top: calc(var(--space) * 0.5);
            color: var(--muted);
        }

        #message.ok { color: var(--up); }
        #message.error { color: var(--down); }

        .empty {
            color: var(--muted);
            font-size: 0.75rem;
        }

        #verify {
            width: 100%;
            background: transparent;
            border: 1px solid var(--line);
            border-top: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.6875rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: var(--space);
            margin-top: calc(var(--space) * 1.5);
            cursor: pointer;
        }

        #verify:hover {
            color: var(--text);
            border-color: var(--muted);
        }

        #verify-result {
            font-family: var(--mono);
            font-size: 0.6875rem;
            min-height: 1rem;
            margin-top: calc(var(--space) * 0.5);
        }

    </style>


</head>

<body>
    <h1>Trading Simulator</h1>


    <div id="symbols">

        {% for instrument in instruments%}
            <button data-symbol="{{ instrument.symbol }}">{{ instrument.symbol }}</button>
        {% endfor %}


    </div>


    <div class="layout">
        <div id="chart"></div>
        <div class="panel">

            <div class="balance">
                <div class="label">Cash</div>
                <div class="value" id="cash">-</div>
            </div>

            <form id="order-form">

                <input type="number" id="quantity" min="1" value="1" required>  

                <select id="order-type">
                    <option value="market">Market</option>
                    <option value="limit">Limit</option>
                </select>

                <input type="number" id="limit-price" step="0.01" placeholder="Limit price" hidden>

                <div class="actions">
                    <button type="submit" value="buy" id="buy">Buy</button>
                    <button type="submit" value="sell" id="sell">Sell</button>
                </div>

            </form>

            <div id="message"></div>

            <h2>Positions</h2>
            <div id="positions"></div>

            <button id="verify" type="button">Verify ledger</button>
            <div id="verify-result"></div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>


    <script>

        const chart = LightweightCharts.createChart(document.getElementById("chart"), {
            autoSize: true,
            layout: {
                background: {color: "#0b0c0e"},
                textColor: "#6b7280",
            },

            grid: {
                vertLines: {color: "#1a1d21"},
                horzLines: {color: "#1a1d21"}
                
            }
            
        });

        const series = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor: "#2ec4a6",
            downColor: "#f2645c",
            borderVisible: false,
            wickUpColor: "#2ec4a6",
            wickDownColor: "#f2645c"
        });

        function loadSymbol(symbol) {

            document.querySelectorAll("#symbols button").forEach(button => {

                button.classList.toggle("active", button.dataset.symbol === symbol);


            });

            fetch(`/api/candles/${symbol}/`)
                .then(response => response.json())
                .then(data => series.setData(data));
        }

        function loadPortfolio() {
            fetch("/api/portfolio/")
            .then(response => response.json())
            .then(data => {
                document.getElementById("cash").textContent = `$${data.cash.toFixed(2)}`;

                const positions = document.getElementById("positions");

                if (data.positions.length === 0) {
                    positions.innerHTML = `<p class="empty">No positions yet.</p>`;
                    return;
                }

                positions.innerHTML = data.positions.map(p => `
                    <div class="position">

                        <div class="row">
                            <span class="symbol">${p.symbol}</span>
                            <span class="qty">${p.quantity}</span>
                        </div>
                    
                        <div class="row muted">
                            <span>avg $${p.average_cost.toFixed(2)}</span>
                            <span>now $${p.current_price.toFixed(2)}</span>
                        </div>

                        <div class="row">
                            <span>$${p.value.toFixed(2)}</span>
                            <span class="${p.unrealised_pnl >= 0 ? "up" : "down"}">
                                ${p.unrealised_pnl >= 0 ? "+" : ""}$${p.unrealised_pnl.toFixed(2)}    
                            </span>
                        </div>
                    </div>
                `).join("");


            });
        }


        function getCookie(name) {
            const match = document.cookie.match(new RegExp(`(^| )${name}=([^;]+)`));
            return match ? match[2] : null;
        }

        function placeOrder(side) {
            const symbol = document.querySelector("#symbols button.active").dataset.symbol;
            const orderType = document.getElementById("order-type").value;

            const body = {
                symbol: symbol,
                side: side, 
                quantity: document.getElementById("quantity").value, 
                order_type: orderType,
            };


            if (orderType === "limit") {
                body.limit_price = document.getElementById("limit-price").value;
            }

            fetch("/api/order/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken"),
                },
                body: JSON.stringify(body),
            })

            .then(response => response.json().then(data => ({ok: response.ok, data})))
            .then(({ok, data}) => {
                const message = document.getElementById("message");

                message.className = ok ? "ok" : "error";
                message.textContent = ok
                    ? `${side[0].toUpperCase()}${side.slice(1)} ${data.quantity} ${data.symbol} at $${data.fill_price.toFixed(2)}`
                    : data.error;


                loadPortfolio();
            });

        }

        loadPortfolio();
        loadSymbol("AAPL");

        document.getElementById("order-form").addEventListener("submit", event => {
            event.preventDefault();
            placeOrder(event.submitter.value);
        });


        document.querySelectorAll("#symbols button").forEach(button => {
            button.addEventListener("click", () => {
                loadSymbol(button.dataset.symbol);
            });
        });

        document.getElementById("order-type").addEventListener("change", event => {
            document.getElementById("limit-price").hidden = event.target.value !== "limit";
        });


        document.getElementById("verify").addEventListener("click", () => {
            fetch("/api/verify/")
                .then(response => response.json())
                .then(data => {
                    const result = document.getElementById("verify-result");

                    if (data.intact) {
                        result.textContent = `Chain intact — ${data.entries} entries verified`;
                        result.className = "up";
                    } else {
                        result.textContent = `Broken at entry ${data.sequence} — ${data.failure} mismatch`;
                        result.className = "down";
                    }
                });
        });


    </script>




</body>

</html>
